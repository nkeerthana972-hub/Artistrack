{% extends 'base.html' %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="container" style="max-width:600px;">

    <div class="ds-card">

        <h3 style="margin-bottom:20px;">
            Change Password
        </h3>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Current Password</label>
                {{ form.old_password }}
            </div>

            <div class="mb-3">
                <label>New Password</label>
                {{ form.new_password1 }}
            </div>

            <div class="mb-3">
                <label>Confirm New Password</label>
                {{ form.new_password2 }}
            </div>

            <div class="form-group">
                <label>Captcha</label>
                {{ form.captcha }}
            </div>

            <button
                type="submit"
                class="ds-btn ds-btn-primary"
            >
                Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
