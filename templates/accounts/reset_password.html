{% extends 'base_public.html' %}

{% block content %}

<div class="container mt-5">

    <h2>Reset Password</h2>

    <form method="POST">

        {% if form.errors %}
        <div class="ds-alert ds-alert-error">
            {{ form.errors }}
        </div>
        {% endif %}

        {% csrf_token %}

        {{ form.as_p }}

        

        <button
            type="submit"
            class="btn btn-primary"
        >
            Update Password
        </button>

    </form>

</div>

{% endblock %}
