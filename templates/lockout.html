<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Locked • ArtisTrack</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#0d0f12;
            font-family:'DM Sans',sans-serif;
            color:#fff;
            padding:24px;
        }

        .lockout-card{
            width:100%;
            max-width:460px;
            background:#181c22;
            border:1px solid rgba(255,255,255,.08);
            border-radius:20px;
            padding:42px 36px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,.35);
        }

        .lockout-icon{
            width:78px;
            height:78px;
            margin:0 auto 22px;
            border-radius:50%;
            background:rgba(239,68,68,.12);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
            color:#ef4444;
        }

        h1{
            margin:0 0 12px;
            font-size:28px;
            font-weight:600;
        }

        p{
            margin:0;
            color:#9aa0b4;
            line-height:1.7;
            font-size:15px;
        }

        .lockout-time{
            margin-top:18px;
            color:#f59e0b;
            font-weight:500;
        }

        /* countdown ring */
        .countdown-wrap{
            margin:28px auto 0;
            width:110px;
            height:110px;
            position:relative;
        }

        .countdown-wrap svg{
            transform:rotate(-90deg);
        }

        .countdown-wrap svg circle{
            fill:none;
            stroke-width:6;
        }

        .ring-bg{
            stroke:rgba(255,255,255,.07);
        }

        .ring-progress{
            stroke:#7c6af7;
            stroke-linecap:round;
            stroke-dasharray:283;
            stroke-dashoffset:0;
            transition:stroke-dashoffset 1s linear;
        }

        .countdown-label{
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:2px;
        }

        .countdown-digits{
            font-size:22px;
            font-weight:600;
            letter-spacing:1px;
            color:#fff;
        }

        .countdown-sub{
            font-size:11px;
            color:#9aa0b4;
            text-transform:uppercase;
            letter-spacing:.5px;
        }

        .unlocked-msg{
            display:none;
            margin-top:28px;
            color:#22c55e;
            font-weight:500;
            font-size:15px;
        }

        .lockout-btn{
            margin-top:30px;
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:12px 20px;
            border-radius:10px;
            background:#7c6af7;
            color:#fff;
            text-decoration:none;
            font-size:14px;
            font-weight:500;
            transition:.2s ease;
        }

        .lockout-btn:hover{
            background:#9b8dff;
        }

    </style>

</head>

<body>

    <div class="lockout-card">

        <div class="lockout-icon">
            <i class="ri-shield-keyhole-line"></i>
        </div>

        <h1>Account Temporarily Locked</h1>

        <p>
            Multiple failed login attempts were detected on your account.
        </p>

        <p class="lockout-time">
            Your account will unlock automatically when the timer expires.
        </p>

        <!-- countdown ring -->
        <div class="countdown-wrap">
            <svg width="110" height="110" viewBox="0 0 110 110">
                <circle class="ring-bg" cx="55" cy="55" r="45"/>
                <circle class="ring-progress" id="ring" cx="55" cy="55" r="45"/>
            </svg>
            <div class="countdown-label">
                <span class="countdown-digits" id="countdown">15:00</span>
                <span class="countdown-sub">remaining</span>
            </div>
        </div>

        <p class="unlocked-msg" id="unlocked-msg">
            <i class="ri-checkbox-circle-line"></i> Unlocked — redirecting to login…
        </p>

        <a href="/login/" class="lockout-btn">
            <i class="ri-arrow-left-line"></i>
            Back to Login
        </a>

    </div>

    <script>
        const COOLOFF_SECONDS = 15 * 60; // match your AXES_COOLOFF_TIME

        // Store lockout start time in sessionStorage so refresh doesn't reset it
        const KEY = 'artistrack_lockout_start';
        if (!sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, Date.now());
        }

        const startTime  = parseInt(sessionStorage.getItem(KEY));
        const ring       = document.getElementById('ring');
        const display    = document.getElementById('countdown');
        const unlockedMsg = document.getElementById('unlocked-msg');
        const circumference = 2 * Math.PI * 45; // ~283

        ring.style.strokeDasharray  = circumference;
        ring.style.strokeDashoffset = 0;

        function tick() {
            const elapsed  = Math.floor((Date.now() - startTime) / 1000);
            const timeLeft = Math.max(COOLOFF_SECONDS - elapsed, 0);

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

            // shrink ring proportionally
            const progress = timeLeft / COOLOFF_SECONDS;
            ring.style.strokeDashoffset = circumference * (1 - progress);

            // change ring colour in last 60s
            ring.style.stroke = timeLeft <= 60 ? '#ef4444' : '#7c6af7';

            if (timeLeft <= 0) {
                clearInterval(interval);
                display.textContent = '00:00';
                unlockedMsg.style.display = 'block';
                sessionStorage.removeItem(KEY);
                setTimeout(() => { window.location.href = '/login/'; }, 2000);
            }
        }

        tick(); // run immediately
        const interval = setInterval(tick, 1000);
    </script>

</body>

</html>
