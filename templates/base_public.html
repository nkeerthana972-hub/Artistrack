<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ArtisTrack{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{--ds-font:'DM Sans',system-ui,sans-serif;--ds-font-serif:'DM Serif Display',Georgia,serif;--ds-bg:#0d0f12;--ds-surface:#181c22;--ds-surface-2:#1f2430;--ds-border:rgba(255,255,255,0.07);--ds-border-2:rgba(255,255,255,0.13);--ds-accent:#7c6af7;--ds-accent-2:#9b8dff;--ds-accent-glow:rgba(124,106,247,0.18);--ds-success:#22c55e;--ds-warning:#f59e0b;--ds-danger:#ef4444;--ds-info:#38bdf8;--ds-text:#e8eaf0;--ds-text-2:#9aa0b4;--ds-text-3:#5a6070;--ds-radius-sm:6px;--ds-radius:10px;--ds-radius-lg:14px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--ds-font);background:var(--ds-bg);color:var(--ds-text);font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:var(--ds-accent-2);text-decoration:none}a:hover{color:#fff}
    input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=tel],textarea,select{background:var(--ds-surface)!important;border:1px solid var(--ds-border-2)!important;border-radius:var(--ds-radius-sm)!important;color:var(--ds-text)!important;padding:9px 12px!important;font-family:var(--ds-font)!important;font-size:14px!important;width:100%!important;transition:border .15s,box-shadow .15s;outline:none!important}
    input:focus,textarea:focus,select:focus{border-color:var(--ds-accent)!important;box-shadow:0 0 0 3px var(--ds-accent-glow)!important}
    label{font-size:12px;font-weight:500;color:var(--ds-text-2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
    .ds-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--ds-radius-sm);font-size:13px;font-weight:500;font-family:var(--ds-font);cursor:pointer;border:none;transition:all .15s;text-decoration:none}
    .ds-btn-primary{background:var(--ds-accent);color:#fff}.ds-btn-primary:hover{background:var(--ds-accent-2);color:#fff}
    .ds-btn-ghost{background:transparent;border:1px solid var(--ds-border-2);color:var(--ds-text-2)}.ds-btn-ghost:hover{background:var(--ds-surface-2);color:var(--ds-text);border-color:var(--ds-border-2)}
    .ds-logo-icon{background:var(--ds-accent);border-radius:var(--ds-radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
    .ds-logo-text{font-family:var(--ds-font-serif);color:var(--ds-text)}.ds-logo-text span{color:var(--ds-accent-2)}
    .ds-alert{padding:12px 16px;border-radius:var(--ds-radius-sm);font-size:13.5px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .ds-alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#86efac}
    .ds-alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
    .ds-alert-info{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:#7dd3fc}
    .ds-alert-warning{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#fcd34d}
    .ds-pub-topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(13,15,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--ds-border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:200}
  </style>
</head>
<body>
  <header class="ds-pub-topbar">
    <a href="/" style="display:flex;align-items:center;gap:9px;">
      <div class="ds-logo-icon" style="width:30px;height:30px;font-size:15px;"><i class="ri-music-2-line"></i></div>
      <span class="ds-logo-text" style="font-size:16px;">Artis<span>Track</span></span>
    </a>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="/login/"    class="ds-btn ds-btn-ghost"   style="font-size:13px;padding:6px 14px;"><i class="ri-login-box-line"></i> Login</a>
      <a href="/register/" class="ds-btn ds-btn-primary" style="font-size:13px;padding:6px 14px;"><i class="ri-user-add-line"></i> Register</a>
    </div>
  </header>

  <div style="padding-top:56px;">
    {% if messages %}
      <div style="max-width:700px;margin:16px auto;padding:0 16px;">
        {% for message in messages %}
          <div class="ds-alert ds-alert-{{ message.tags|default:'success' }}">
            <i class="ri-information-line"></i> {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
