{% if logs.has_previous %}
<li class="page-item">
    <a class="page-link" data-page="{{ logs.previous_page_number }}" href="#">
        Prev
    </a>
</li>
{% endif %}

<li class="page-item active">
    <span class="page-link">
        Page {{ logs.number }}
    </span>
</li>

{% if logs.has_next %}
<li class="page-item">
    <a class="page-link" data-page="{{ logs.next_page_number }}" href="#">
        Next
    </a>
</li>
{% endif %}
