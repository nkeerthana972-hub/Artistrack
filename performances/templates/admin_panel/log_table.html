<table class="ds-table">

    <thead>
        <tr>
            <th>User</th>
            <th>Role</th>
            <th>Action</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody>

        {% for log in logs %}
        <tr>
            <td>{{ log.user.username }}</td>
            <td>{{ log.user.role }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.timestamp|date:"Y-m-d H:i" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No logs found</td>
        </tr>
        {% endfor %}

    </tbody>

</table>
